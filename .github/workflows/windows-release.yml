name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Run isolated self-test
        run: dotnet run --project Windows/CodexSynced.Windows/CodexSynced.Windows.csproj -c Release -- --self-test

      - name: Test update discovery without network or user data
        run: dotnet run --project Windows/UpdateTests/UpdateTests.csproj -c Release

      - name: Test recoverable backup deletion on isolated fixtures
        run: dotnet run --project Windows/BackupTests/BackupTests.csproj -c Release

      - name: Publish Windows app directory
        run: >
          dotnet publish Windows/CodexSynced.Windows/CodexSynced.Windows.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ env.VERSION }}
          -p:PublishSingleFile=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -o artifacts/publish

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.1
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          wix extension add WixToolset.UI.wixext/6.0.1 --global

      - name: Package Windows files
        shell: pwsh
        run: |
          $env:PATH += ";$env:USERPROFILE\.dotnet\tools"
          $publishDir = (Resolve-Path "artifacts/publish").Path
          foreach ($runtimeFile in @("coreclr.dll", "hostfxr.dll", "hostpolicy.dll")) {
            if (-not (Test-Path -LiteralPath (Join-Path $publishDir $runtimeFile))) {
              throw "Self-contained publish is missing required runtime file: $runtimeFile"
            }
          }
          wix build Windows/Installer/Package.wxs `
            -ext WixToolset.UI.wixext `
            -culture en-US `
            -d ProductVersion=$env:VERSION `
            -d PublishDir=$publishDir `
            -arch x64 `
            -o "artifacts/Codex-Synced-Windows-x64-$env:VERSION.msi"
          Compress-Archive -Path "artifacts/publish/*" -DestinationPath "artifacts/Codex-Synced-Windows-x64-$env:VERSION.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-files
          path: |
            artifacts/Codex-Synced-Windows-x64-${{ env.VERSION }}.msi
            artifacts/Codex-Synced-Windows-x64-${{ env.VERSION }}.zip

  macos:
    runs-on: macos-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Run isolated Swift tests
        run: swift test

      - name: Package macOS DMG
        run: bash scripts/package-dmg.sh "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-release-files
          path: dist/Codex-Synced-macOS-${{ env.VERSION }}.dmg

  publish:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      TAG: v${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Write checksums
        run: |
          cd artifacts
          sha256sum Codex-Synced-* > SHA256SUMS.txt

      - name: Create or update GitHub release
        run: |
          notes_file="docs/release/v$VERSION.md"
          test -f "$notes_file"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Codex Synced $VERSION" --notes-file "$notes_file"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --draft --title "Codex Synced $VERSION" --notes-file "$notes_file"
          fi

          gh release upload "$TAG" artifacts/* --clobber
          gh release edit "$TAG" --draft=false --latest
